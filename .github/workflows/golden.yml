# The golden harness (docs/golden.md) over each group of examples, each job with the tools its
# group needs; a pending example is listed, not run.
name: golden

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simplicial:
    name: Simplicial stations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: paperboatlab/simplicial, path: .simplicial }
      # The optional toolkits 02 (control, optimization) and 08 (opencv) use, installed into the
      # checkout's engine/toolkit/<name> as `paperboat toolkit install` does
      - uses: actions/checkout@v5
        with: { repository: paperboatlab/simplicial-toolkit-optimization, path: .toolkits/optimization }
      - uses: actions/checkout@v5
        with: { repository: paperboatlab/simplicial-toolkit-control, path: .toolkits/control }
      - uses: actions/checkout@v5
        with: { repository: paperboatlab/simplicial-toolkit-opencv, path: .toolkits/opencv }
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build \
            libopencv-core-dev libopencv-imgproc-dev libopencv-imgcodecs-dev rpm2cpio cpio
          for t in optimization control opencv; do cp -r .toolkits/$t/engine/toolkit/$t .simplicial/engine/toolkit/; done
      # paperboat and paperboatd from the newest release's rpm: the Python levels lease their runtime
      # from paperboatd (docker here), as on a desktop
      - run: |
          tag=$(gh release list -R paperboatlab/paperboat -L 1 --json tagName -q '.[0].tagName')
          gh release download "$tag" -R paperboatlab/paperboat -p 'paperboat-cli-*.x86_64.rpm' -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/paperboat" && cd "$RUNNER_TEMP/paperboat" && rpm2cpio "$RUNNER_TEMP"/paperboat-cli-*.rpm | cpio -idm --quiet
          echo "$RUNNER_TEMP/paperboat/usr/bin" >> "$GITHUB_PATH"
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: paperboat runtime list && python3 golden.py --strict simplicial/
        env:
          SIMPLICIAL_DIR: ${{ github.workspace }}/.simplicial
          CMAKE_GENERATOR: Ninja

  julix:
    name: Julix folders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with: { version: '1.11' }
      # ~/.julia: the folders' packages (JulixPlot, CasADiNative and its JLLs), which each check instantiates
      - uses: julia-actions/cache@v2
      - run: python3 golden.py --strict julix/

  modelica:
    name: Modelica models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # omc's HOME, where installPackage puts the MSL the models pin (simulate.mos): kept between runs
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/omc-home
          key: omc-1.27.1-msl-4.1.0
      # omc from the OpenModelica image, called as `omc` by the models' checks
      - run: |
          docker pull -q docker.io/openmodelica/openmodelica:v1.27.1-minimal
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/omc-home"
          printf '#!/bin/sh\nexec docker run --rm -v "$PWD:$PWD" -v "%s:/omc" -w "$PWD" -u "$(id -u):$(id -g)" --tmpfs /tmp -e HOME=/omc docker.io/openmodelica/openmodelica:v1.27.1-minimal omc "$@"\n' "$RUNNER_TEMP/omc-home" > "$RUNNER_TEMP/bin/omc"
          chmod +x "$RUNNER_TEMP/bin/omc" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: omc --version && python3 golden.py --strict modelica/

  malachite:
    name: Malachite hubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: paperboatlab/malachite, path: .malachite-app }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: python3 golden.py --strict malachite/
        env:
          MALACHITE_DIR: ${{ github.workspace }}/.malachite-app
