# Rig as a Paperboat station, generated by `articula generate` from
# modelica/Rig.mo. Written once: edit it freely, generate leaves it alone.
# The Rig station object is domain/rig.cpp (its props: the model's
# parameters and fixed starts); each one spawns a linked block on the Flow page.
domain = "rig"
import = ["base", "signal", "math", "board", "step", "control", "optimization"]

[connectors.RealInput]
kind = "input"
handle = "triangle"
size = 8
weight = 1.2

[connectors.RealOutput]
kind = "output"
handle = "circle"
alt = "filled"
size = 8
weight = 1.2

# A model has no geometry of its own: the Station shows its objects as a graph.
[station]
view = "graph"
objects = [
  { id = "rig-1", type = "rig" },
]

# Starter: a step on each input, a graph on each output.
[graph]
nodes = [
  { id = "rig-1", type = "rig", pos = [260, 0] },
  { id = "step-cmd", type = "step", pos = [0, 0] },
  { id = "graph-theta", type = "graph", pos = [520, 0] },
  { id = "graph-alpha", type = "graph", pos = [520, 120] },
]
edges = [
  { from = ["step-cmd", "y"], to = ["rig-1", "cmd"] },
  { from = ["rig-1", "theta"], to = ["graph-theta", "in"] },
  { from = ["rig-1", "alpha"], to = ["graph-alpha", "in"] },
]
