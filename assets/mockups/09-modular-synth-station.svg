<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>
    <linearGradient id="walnutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#270e02" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="knobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="url(#bgGrad9)" />

  <!-- Station Viewport Frame -->
  <rect x="25" y="45" width="850" height="455" rx="6" fill="#10141b" stroke="#263140" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="25" y="45" width="850" height="34" rx="6" fill="#18202b" stroke="#263140" stroke-width="1" />
  <circle cx="45" cy="62" r="5" fill="#10b981" />
  <text x="60" y="66" fill="#f1f5f9" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="12" font-weight="700" letter-spacing="1">STATION // 09-MODULAR-SYNTH-CPP [LOOKOUT]</text>
  <rect x="420" y="53" width="95" height="18" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="428" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">SOLVER: RK4</text>
  <rect x="525" y="53" width="135" height="18" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="533" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">LOOKOUT: 3D RACK</text>
  <text x="800" y="66" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">PORT: 8773</text>

  <!-- Eurorack Chassis (Angled 3D Skiff Case) -->
  <g transform="translate(110, 110)">
    <!-- Left Walnut Wooden Cheek -->
    <polygon points="0,20 20,0 20,280 0,300" fill="url(#walnutGrad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Right Walnut Wooden Cheek -->
    <polygon points="680,0 700,20 700,300 680,280" fill="url(#walnutGrad)" stroke="#92400e" stroke-width="1.5" />

    <!-- Chassis Top / Bottom Extruded Rails -->
    <rect x="20" y="0" width="660" height="14" fill="#334155" stroke="#475569" stroke-width="1" />
    <rect x="20" y="266" width="660" height="14" fill="#334155" stroke="#475569" stroke-width="1" />
    <rect x="20" y="133" width="660" height="14" fill="#334155" stroke="#475569" stroke-width="1" /> <!-- Center Divider Rail -->

    <!-- MODULE 1: VCO 1 (Oscillator) [x: 20 to 140] -->
    <g transform="translate(20, 14)">
      <rect x="0" y="0" width="120" height="252" fill="url(#panelGrad)" stroke="#334155" stroke-width="1" />
      <text x="60" y="24" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">VCO-01</text>
      <!-- Coarse Frequency Knob -->
      <circle cx="60" cy="65" r="22" fill="url(#knobGrad)" stroke="#94a3b8" stroke-width="2" />
      <line x1="60" y1="65" x2="75" y2="50" stroke="#38bdf8" stroke-width="2.5" />
      <text x="60" y="100" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">COARSE (440Hz)</text>

      <!-- Fine Tuning Knob -->
      <circle cx="60" cy="130" r="14" fill="url(#knobGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="60" y1="130" x2="60" y2="118" stroke="#38bdf8" stroke-width="2" />
      <text x="60" y="155" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">FINE TUNE</text>

      <!-- Patch Jacks: Saw, Square, Tri -->
      <circle cx="35" cy="190" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="35" cy="190" r="3" fill="#38bdf8" />
      <text x="35" y="210" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">SAW</text>

      <circle cx="85" cy="190" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="85" cy="190" r="3" fill="#94a3b8" />
      <text x="85" y="210" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">SQR</text>

      <circle cx="60" cy="230" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="60" cy="230" r="3" fill="#94a3b8" />
      <text x="60" y="246" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">1V/OCT</text>
    </g>

    <!-- MODULE 2: VCF (Resonant Filter) [x: 140 to 260] -->
    <g transform="translate(140, 14)">
      <rect x="0" y="0" width="120" height="252" fill="url(#panelGrad)" stroke="#334155" stroke-width="1" />
      <text x="60" y="24" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">VCF-LADDER</text>
      <!-- Cutoff Frequency Big Knob -->
      <circle cx="60" cy="70" r="26" fill="url(#knobGrad)" stroke="#f59e0b" stroke-width="2" />
      <line x1="60" y1="70" x2="78" y2="52" stroke="#f59e0b" stroke-width="3" />
      <text x="60" y="108" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">CUTOFF 1.8 kHz</text>

      <!-- Resonance Knob -->
      <circle cx="60" cy="140" r="16" fill="url(#knobGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="60" y1="140" x2="72" y2="130" stroke="#f59e0b" stroke-width="2" />
      <text x="60" y="168" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">RESONANCE</text>

      <!-- Filter In / Out Jacks -->
      <circle cx="35" cy="200" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="35" cy="200" r="3" fill="#f59e0b" />
      <text x="35" y="220" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">AUDIO IN</text>

      <circle cx="85" cy="200" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="85" cy="200" r="3" fill="#f59e0b" />
      <text x="85" y="220" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">LPF OUT</text>
    </g>

    <!-- MODULE 3: DIGITAL FFT & WAVE SCOPE [x: 260 to 460] -->
    <g transform="translate(260, 14)">
      <rect x="0" y="0" width="200" height="252" fill="#090d14" stroke="#334155" stroke-width="1" />
      <text x="100" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">SCOPE // SPECTRUM FFT</text>
      
      <!-- Scope Screen Bezel -->
      <rect x="15" y="32" width="170" height="110" rx="3" fill="#05080e" stroke="#1e293b" stroke-width="1.5" />
      <!-- Scope Grid Lines -->
      <line x1="15" y1="87" x2="185" y2="87" stroke="#1e293b" stroke-width="1" />
      <line x1="100" y1="32" x2="100" y2="142" stroke="#1e293b" stroke-width="1" />
      <!-- Waveform (Filtered Saw Wave with Resonance Ringing) -->
      <path d="M 20,87 
               C 30,55 35,45 45,87 
               L 45,115 
               C 55,70 65,55 75,87 
               L 75,115 
               C 85,70 95,55 105,87 
               L 105,115 
               C 115,70 125,55 135,87 
               L 135,115 
               C 145,70 155,55 165,87 
               L 165,115" 
            fill="none" stroke="#22c55e" stroke-width="2" />

      <!-- Scope Controls / Timebase Knobs -->
      <circle cx="50" cy="175" r="14" fill="url(#knobGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <text x="50" y="200" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">TIME/DIV</text>

      <circle cx="100" cy="175" r="14" fill="url(#knobGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <text x="100" y="200" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">VOLT/DIV</text>

      <circle cx="150" cy="175" r="14" fill="url(#knobGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <text x="150" y="200" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">TRIG AUTO</text>

      <circle cx="100" cy="225" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="100" cy="225" r="3" fill="#22c55e" />
      <text x="100" y="244" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">SCOPE IN</text>
    </g>

    <!-- MODULE 4: ADSR ENVELOPE [x: 460 to 570] -->
    <g transform="translate(460, 14)">
      <rect x="0" y="0" width="110" height="252" fill="url(#panelGrad)" stroke="#334155" stroke-width="1" />
      <text x="55" y="24" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">ADSR-ENV</text>
      
      <!-- 4 Vertical Sliders -->
      <!-- A -->
      <line x1="20" y1="50" x2="20" y2="150" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <rect x="14" y="110" width="12" height="10" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
      <text x="20" y="165" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">A</text>
      <!-- D -->
      <line x1="42" y1="50" x2="42" y2="150" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <rect x="36" y="80" width="12" height="10" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
      <text x="42" y="165" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">D</text>
      <!-- S -->
      <line x1="65" y1="50" x2="65" y2="150" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <rect x="59" y="90" width="12" height="10" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
      <text x="65" y="165" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">S</text>
      <!-- R -->
      <line x1="88" y1="50" x2="88" y2="150" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <rect x="82" y="125" width="12" height="10" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
      <text x="88" y="165" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">R</text>

      <!-- Gate In & Env Out Jacks -->
      <circle cx="35" cy="205" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="35" cy="205" r="3" fill="#ec4899" />
      <text x="35" y="225" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">GATE</text>

      <circle cx="75" cy="205" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="75" cy="205" r="3" fill="#ec4899" />
      <text x="75" y="225" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">ENV</text>
    </g>

    <!-- MODULE 5: MASTER OUTPUT & VU METERS [x: 570 to 680] -->
    <g transform="translate(570, 14)">
      <rect x="0" y="0" width="110" height="252" fill="url(#panelGrad)" stroke="#334155" stroke-width="1" />
      <text x="55" y="24" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">OUTPUT</text>
      
      <!-- Stereo LED VU Bars -->
      <g transform="translate(38, 45)">
        <rect x="0" y="0" width="12" height="90" rx="2" fill="#0b0f17" stroke="#334155" stroke-width="1" />
        <rect x="2" y="30" width="8" height="58" fill="#10b981" />
        <rect x="2" y="15" width="8" height="15" fill="#facc15" />
        <rect x="2" y="4" width="8" height="11" fill="#ef4444" opacity="0.3" /> <!-- No clipping -->

        <rect x="20" y="0" width="12" height="90" rx="2" fill="#0b0f17" stroke="#334155" stroke-width="1" />
        <rect x="22" y="30" width="8" height="58" fill="#10b981" />
        <rect x="22" y="15" width="8" height="15" fill="#facc15" />
        <rect x="22" y="4" width="8" height="11" fill="#ef4444" opacity="0.3" />
        <text x="16" y="105" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">L / R VU</text>
      </g>

      <!-- Main Volume Knob -->
      <circle cx="55" cy="170" r="18" fill="url(#knobGrad)" stroke="#38bdf8" stroke-width="2" />
      <line x1="55" y1="170" x2="68" y2="157" stroke="#38bdf8" stroke-width="2.5" />
      <text x="55" y="200" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">VOL: -3 dB</text>

      <!-- Stereo Out Jacks -->
      <circle cx="35" cy="225" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="35" cy="225" r="3" fill="#cbd5e1" />
      <circle cx="75" cy="225" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="75" cy="225" r="3" fill="#cbd5e1" />
    </g>

    <!-- Patch Cables (Glowing Bezier curves draped between modules) -->
    <!-- Cable 1: VCO Saw (x=55, y=204) to VCF Audio In (x=175, y=214) [Cyan] -->
    <path d="M 55,204 C 80,260 150,265 175,214" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <path d="M 55,204 C 80,260 150,265 175,214" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round" />

    <!-- Cable 2: VCF Out (x=225, y=214) to Scope In (x=360, y=239) [Emerald] -->
    <path d="M 225,214 C 260,290 320,295 360,239" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <path d="M 225,214 C 260,290 320,295 360,239" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" />

    <!-- Cable 3: Env Out (x=535, y=219) to Filter Cutoff CV [Magenta] -->
    <path d="M 535,219 C 450,300 250,280 200,214" fill="none" stroke="#d946ef" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Station HUD / Telemetry Bottom Ribbon -->
  <rect x="25" y="470" width="850" height="30" rx="4" fill="#141a24" stroke="#263140" stroke-width="1" />
  <g transform="translate(45, 490)">
    <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">FREQ:</text>
    <text x="45" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">440.0 Hz (A4)</text>

    <text x="175" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">WAVEFORM:</text>
    <text x="255" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">BANDLIMITED SAW</text>

    <text x="400" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">CUTOFF:</text>
    <text x="465" y="0" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">1,850 Hz (Q=4.2)</text>

    <text x="610" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">LEVEL:</text>
    <text x="665" y="0" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">-3.2 dBFS [CLEAN]</text>
  </g>
</svg>
