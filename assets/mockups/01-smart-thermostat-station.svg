<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>
    <linearGradient id="roomFloorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b222d" />
      <stop offset="100%" stop-color="#12161d" />
    </linearGradient>
    <linearGradient id="glassWallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="heatPlumeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3342" />
      <stop offset="100%" stop-color="#11161d" />
    </linearGradient>
    <radialGradient id="dialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.0" />
    </radialGradient>
    
    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="40" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 12 L 20 0 L 40 12 L 20 24 Z" fill="none" stroke="#222b38" stroke-width="0.7" stroke-dasharray="2 2" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="550" fill="url(#bgGrad)" />

  <!-- Station Viewport Border & Grid -->
  <rect x="25" y="45" width="850" height="455" rx="6" fill="#10141b" stroke="#263140" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="25" y="45" width="850" height="34" rx="6" fill="#18202b" stroke="#263140" stroke-width="1" />
  <circle cx="45" cy="62" r="5" fill="#10b981" />
  <text x="60" y="66" fill="#f1f5f9" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="12" font-weight="700" letter-spacing="1">STATION // 01-SMART-THERMOSTAT</text>
  <rect x="360" y="53" width="95" height="18" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="368" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">SOLVER: RK4</text>
  <rect x="465" y="53" width="105" height="18" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="473" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">VIEW: ISO 3D</text>
  <text x="800" y="66" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">PORT: 8765</text>

  <!-- Isometric Ground / Room Geometry -->
  <g transform="translate(450, 270)">
    <!-- Room Floor (Isometric Poly) -->
    <polygon points="0,-120 280,30 0,180 -280,30" fill="url(#roomFloorGrad)" stroke="#334155" stroke-width="1.5" />
    <polygon points="0,-120 280,30 0,180 -280,30" fill="url(#isoGrid)" opacity="0.6" />

    <!-- Left Wall (Glass window to cold exterior) -->
    <polygon points="-280,30 0,-120 0,-210 -280,-60" fill="url(#glassWallGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Glass Mullions -->
    <line x1="-140" y1="-45" x2="-140" y2="-135" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <line x1="-210" y1="-7.5" x2="-210" y2="-97.5" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <line x1="-70" y1="-82.5" x2="-70" y2="-172.5" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Exterior Cold Marker -->
    <text x="-210" y="-120" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">OUTDOOR: -2.5 °C</text>
    <path d="M -160,-110 L -140,-95" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Right Wall (Interior partition wall with Thermostat dial) -->
    <polygon points="0,-120 280,30 280,-60 0,-210" fill="#18212e" stroke="#334155" stroke-width="1.5" />
    
    <!-- Convection Baseboard Radiator (Bottom-right floor edge) -->
    <g transform="translate(100, 75)">
      <polygon points="0,0 120,-65 120,-95 0,-30" fill="#334155" stroke="#475569" stroke-width="1" />
      <polygon points="0,-30 120,-95 128,-91 8,-26" fill="#475569" />
      <!-- Radiator Slits -->
      <line x1="20" y1="-25" x2="20" y2="-45" stroke="#1e293b" stroke-width="2" />
      <line x1="40" y1="-35" x2="40" y2="-55" stroke="#1e293b" stroke-width="2" />
      <line x1="60" y1="-45" x2="60" y2="-65" stroke="#1e293b" stroke-width="2" />
      <line x1="80" y1="-55" x2="80" y2="-75" stroke="#1e293b" stroke-width="2" />
      <line x1="100" y1="-65" x2="100" y2="-85" stroke="#1e293b" stroke-width="2" />

      <!-- Heat Rising Thermal Plumes -->
      <path d="M 30,-50 C 35,-90 15,-110 30,-150" fill="none" stroke="url(#heatPlumeGrad)" stroke-width="4" stroke-linecap="round" />
      <path d="M 60,-60 C 65,-100 45,-120 60,-160" fill="none" stroke="url(#heatPlumeGrad)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 90,-70 C 95,-110 75,-130 90,-170" fill="none" stroke="url(#heatPlumeGrad)" stroke-width="4" stroke-linecap="round" />
      
      <rect x="35" y="-195" width="85" height="18" rx="3" fill="#451a03" stroke="#f97316" stroke-width="1" />
      <text x="42" y="-182" fill="#fdba74" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">HEATER: ON</text>
    </g>

    <!-- Wall-Mounted Thermostat Dial on Right Wall -->
    <g transform="translate(140, -115)">
      <!-- Projection Ellipse / Shadow -->
      <ellipse cx="0" cy="0" rx="42" ry="42" fill="url(#dialGlow)" />
      <circle cx="0" cy="0" r="38" fill="url(#dialGrad)" stroke="#f97316" stroke-width="2" />
      <circle cx="0" cy="0" r="33" fill="#0b0f14" stroke="#334155" stroke-width="1" />
      <!-- Dial Ticks -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="2 6" />
      <!-- Reading Text -->
      <text x="0" y="-3" text-anchor="middle" fill="#f8fafc" font-family="'JetBrains Mono', sans-serif" font-size="14" font-weight="800">21.4°</text>
      <text x="0" y="14" text-anchor="middle" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">SET: 22.0°</text>
      <!-- Target Tick Arrow -->
      <polygon points="0,-33 -4,-26 4,-26" fill="#f59e0b" />
    </g>

    <!-- Thermal Isobars / Air Temperature Field Lines -->
    <path d="M -120,40 Q -20,20 100,-10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <text x="-90" y="32" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="9">19.2 °C</text>
    <path d="M -80,90 Q 20,70 140,40" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <text x="-50" y="82" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="9">20.8 °C</text>
    <path d="M -40,140 Q 60,120 180,90" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <text x="-10" y="132" fill="#fdba74" font-family="'JetBrains Mono', monospace" font-size="9">22.1 °C</text>
  </g>

  <!-- Coordinate Triad (Bottom-Left) -->
  <g transform="translate(60, 460)">
    <line x1="0" y1="0" x2="35" y2="-12" stroke="#ef4444" stroke-width="2" />
    <text x="40" y="-10" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">+X (5.0m)</text>
    <line x1="0" y1="0" x2="-25" y2="-12" stroke="#10b981" stroke-width="2" />
    <text x="-55" y="-12" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">+Y (4.0m)</text>
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#38bdf8" stroke-width="2" />
    <text x="-5" y="-44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">+Z</text>
  </g>

  <!-- Station HUD / Telemetry Bottom Ribbon -->
  <rect x="25" y="470" width="850" height="30" rx="4" fill="#141a24" stroke="#263140" stroke-width="1" />
  <g transform="translate(45, 490)">
    <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">T_ROOM:</text>
    <text x="55" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">21.42 °C</text>

    <text x="145" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">T_TARGET:</text>
    <text x="215" y="0" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">22.00 °C</text>

    <text x="305" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">BAND:</text>
    <text x="345" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">±0.50 °C</text>

    <text x="430" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">HEATER_POWER:</text>
    <text x="530" y="0" fill="#f97316" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">1500 W [ON]</text>

    <text x="650" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">HEAT_LOSS:</text>
    <text x="730" y="0" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">-812 W</text>
  </g>
</svg>
