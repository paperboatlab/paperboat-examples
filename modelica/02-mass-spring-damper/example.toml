# The golden harness's manifest (docs/golden.md): simulate with omc (Articula has no headless
# simulate yet) and compare the chosen variables at the experiment's output times.
kind = "modelica"
app = "articula"
name = "02 Mass-spring-damper"
description = "Second order as two equations: an underdamped oscillation"

[[check]]
name = "simulate"
requires = ["omc"]
run = ["omc", "simulate.mos"]
output = "csv"
file = "build/MassSpringDamper_res.csv"
vars = ["time", "x", "v"]
golden = "golden.json"
atol = 1e-6
rtol = 1e-4
