# The golden harness's manifest (docs/golden.md): a Python station runs out of process, so the check
# builds Simplicial's engine once (into the repository's build/, shared by every Python level), runs
# the starter headless with `simplicial-engine host . --run`, which leases a Python runtime from
# paperboatd, and compares the run with expected.json (the file `simplicial check` reads).
# The lattice needs numpy, added to the station's package volume first.
kind = "simplicial"
app = "simplicial"
name = "07 Airfoil CFD"
description = "Lattice-Boltzmann wind tunnel: velocity field, streamlines, lift/drag"

[[check]]
name = "starter"
requires = ["cmake", "paperboatd", "paperboat"]
build = [
  ["cmake", "-S", "{simplicial}/engine", "-B", "{repo}/build/simplicial", "-DCMAKE_BUILD_TYPE=Release", "-DPAPERBOAT_BUILD_TESTS=OFF"],
  ["cmake", "--build", "{repo}/build/simplicial", "--target", "simplicial-engine"],
  ["paperboat", "package", "add", "python", "numpy", "--project", "."],
]
run = ["{repo}/build/simplicial/tools/simplicial-engine", "host", ".", "--run"]
timeout = 1800   # seconds per command: the first one builds the engine
output = "simplicial"
golden = "expected.json"
