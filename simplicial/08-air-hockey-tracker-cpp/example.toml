# The golden harness's manifest (docs/golden.md): build the station against a simplicial checkout,
# run its starter headless and compare the run with expected.json (the file `simplicial check` reads).
# With the optional OpenCV toolkit installed in that checkout it runs the OpenCV pipeline (as CI does),
# without it the degraded synthetic one (descriptor-degraded.toml).
kind = "simplicial"
app = "simplicial"
name = "08 Air Hockey Tracker"
description = "Optional OpenCV toolkit: image wires, HSV→centroid pipeline, air-hockey tracking"

[[check]]
name = "starter"
requires = ["cmake"]
build = [
  ["cmake", "-S", ".", "-B", "build", "-DCMAKE_BUILD_TYPE=Release", "-DPAPERBOAT_ENGINE_DIR={simplicial}/engine"],
  ["cmake", "--build", "build", "--target", "paperboat-air-hockey"],
]
run = ["build/paperboat-air-hockey", "--run"]
timeout = 1800   # seconds per command: the build compiles the engine
output = "simplicial"
golden = "expected.json"
