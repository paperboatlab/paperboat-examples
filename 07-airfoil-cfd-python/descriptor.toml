# 07-airfoil-cfd-python: 2-D Airfoil Wind Tunnel (Lattice Boltzmann)
#
# The Flow page is the tunnel pipeline:
#   alpha → NACA 0012 Mask ─┐
#                          ├→ LBM Step (D2Q9) → steps / residual
#   speed → Inflow ────────┘
#                          └→ Lift & Drag Polars → CL, CD, L/D
# Tune alpha (Variables sheet, Alt+V) from -15° to 25°: the field separates and the lift
# curve breaks past 14°. The Station page plots arrows, streamlines and force vectors.
domain = "airfoil"

import = ["base", "dashboard", "math", "signal", "step", "string"]

[[variables]]
name = "alpha"
value = 6.0
unit = "deg"
min = -15.0
max = 25.0
step = 0.5
group = "Wind Tunnel"
note = "Angle of attack; past 14 degrees the profile stalls"
tunable = true

[[variables]]
name = "flow_speed"
value = 0.08
unit = ""
min = 0.04
max = 0.12
step = 0.005
group = "Wind Tunnel"
note = "Free-stream lattice speed U∞"
tunable = true

[graph]
nodes = [
  { id = "alpha-var", type = "variable", params = { name = "alpha" }, pos = [0, 60] },
  { id = "speed-var", type = "variable", params = { name = "flow_speed" }, pos = [0, 260] },
  { id = "airfoil-1", type = "airfoil", pos = [240, 60] },
  { id = "inflow-1", type = "inflow", pos = [240, 260] },
  { id = "lbm-1", type = "lbm_step", params = { substeps = 6 }, pos = [500, 140] },
  { id = "forces-1", type = "forces", pos = [760, 140] },

  { id = "display-cl", type = "display", pos = [1020, 40] },
  { id = "display-cd", type = "display", pos = [1020, 140] },
  { id = "display-ld", type = "display", pos = [1020, 240] },
  { id = "display-steps", type = "display", pos = [1020, 340] },
  { id = "scope-1", type = "scope", params = { inputs = 2 }, pos = [760, 360] },
]
edges = [
  { from = ["alpha-var", "y"], to = ["airfoil-1", "alpha"] },
  { from = ["speed-var", "y"], to = ["inflow-1", "speed"] },
  { from = ["airfoil-1", "alpha"], to = ["lbm-1", "alpha"] },
  { from = ["inflow-1", "u"], to = ["lbm-1", "u"] },
  { from = ["airfoil-1", "alpha"], to = ["forces-1", "alpha"] },
  { from = ["inflow-1", "u"], to = ["forces-1", "u"] },
  { from = ["forces-1", "cl"], to = ["display-cl", "in"] },
  { from = ["forces-1", "cd"], to = ["display-cd", "in"] },
  { from = ["forces-1", "ld"], to = ["display-ld", "in"] },
  { from = ["lbm-1", "steps"], to = ["display-steps", "in"] },
  { from = ["forces-1", "cl"], to = ["scope-1", "a"] },
  { from = ["forces-1", "cd"], to = ["scope-1", "b"] },
]
groups = [
  { id = "geometry", kind = "visual", label = "Geometry & Inflow", nodes = ["alpha-var", "speed-var", "airfoil-1", "inflow-1"] },
  { id = "solver", kind = "visual", label = "LBM Solver", nodes = ["lbm-1"] },
  { id = "polars", kind = "visual", label = "Aerodynamic Polars", nodes = ["forces-1", "display-cl", "display-cd", "display-ld", "display-steps", "scope-1"] },
]

[dashboard]
columns = 6
instruments = [
  { block = "scope-1", size = "xlarge", at = [0, 0] },
  { block = "display-cl", size = "compact", at = [4, 0] },
  { block = "display-cd", size = "compact", at = [5, 0] },
  { block = "display-ld", size = "compact", at = [4, 1] },
  { block = "display-steps", size = "compact", at = [5, 1] },
]
decorations = [
  { kind = "label", text = "NACA 0012 · alpha {alpha} deg", at = [0, 3], span = [2, 1] },
  { kind = "console", at = [2, 3], span = [4, 2] },
]
