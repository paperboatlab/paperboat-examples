# Pole on a cart, balanced by PID blocks. Served by examples/backends/cart-pole-cpp.
domain = "cart-pole"

# Every block and station object of these toolkit packages. control brings the
# Cart-pole station object: add one or more on the Station page, set their properties
# and initial conditions there, and each spawns a linked Cart-pole block on the Flow page
# (force in; x, v, theta, omega out).
import = ["signal", "math", "control", "dashboard"]

# Toolkit templates with this domain's defaults (they replace the imported ones).
[[blocks]]
use = "signal/sine"
defaults = { amplitude = 2, frequency = 0.3 }

[[blocks]]
use = "signal/step"
defaults = { value = 2 }

[[blocks]]
use = "math/gain"
defaults = { k = -1 }

# Starter station (station.load): the objects the Station page opens with. Optional.
[station]
objects = [
  { id = "cart-pole-1", type = "cart-pole", props = { cart_mass = 1, pole_mass = 0.2, pole_length = 1, max_force = 50, x0 = 0, theta0 = 0.15 } },
]

# Starter graph (graph.load): what the Flow page opens with. Optional; without it the
# Flow page opens empty.
[graph]
nodes = [
  { id = "cart-pole-1", type = "cart-pole", pos = [0, 120] },
  { id = "pid-theta", type = "pid", params = { kp = 40, ki = 0, kd = 8 }, pos = [260, 0] },
  { id = "pid-x", type = "pid", params = { kp = 4, ki = 0, kd = 5 }, pos = [260, 200] },
  { id = "sum-1", type = "sum", pos = [520, 100] },
  { id = "graph-theta", type = "graph", pos = [260, 400] },
  { id = "graph-x", type = "graph", pos = [520, 400] },
]
edges = [
  { from = ["cart-pole-1", "theta"], to = ["pid-theta", "e"] },
  { from = ["cart-pole-1", "x"], to = ["pid-x", "e"] },
  { from = ["pid-theta", "u"], to = ["sum-1", "a"] },
  { from = ["pid-x", "u"], to = ["sum-1", "b"] },
  { from = ["sum-1", "y"], to = ["cart-pole-1", "force"] },
  { from = ["cart-pole-1", "theta"], to = ["graph-theta", "in"] },
  { from = ["cart-pole-1", "x"], to = ["graph-x", "in"] },
]
