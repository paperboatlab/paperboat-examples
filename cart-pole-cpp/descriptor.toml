# Pole on a cart, balanced by PID blocks. Served by examples/backends/cart-pole-cpp.
domain = "cart-pole"

# Every block of these toolkit packages (control brings PID). The Cart-pole station object
# is this domain's own (domain/cart_pole.cpp), so it needs no import: add one or more on
# the Station page, set their properties and initial conditions there, and each spawns a
# linked Cart-pole block on the Flow page (force in; x, v, theta, omega out).
import = ["signal", "math", "control", "dashboard"]

# Toolkit templates with this domain's defaults (they replace the imported ones).
[[blocks]]
use = "signal/sine"
defaults = { amplitude = 2, frequency = 0.3 }

[[blocks]]
use = "signal/step"
defaults = { value = 2 }

[[blocks]]
use = "math/gain"
defaults = { k = -1 }

# Default variables (#36): values used by reference, here by the station and the
# controller. Edit them in the Variables sheet (Alt+V); --var name=value sets one for --run.
[[variables]]
name = "pole_length"
value = 1
unit = "m"
min = 0.2
max = 3
group = "Cart-pole"
note = "Pivot to the centre of the bob"

[[variables]]
name = "kp_theta"
value = 40
unit = "N/rad"
group = "Controller"

[[variables]]
name = "kd_theta"
expr = "kp_theta / 5"
unit = "N·s/rad"
group = "Controller"
note = "Damping, a fifth of the stiffness"

# Starter station (station.load): the objects the Station page opens with. Optional.
[station]
objects = [
  { id = "cart-pole-1", type = "cart-pole", props = { cart_mass = 1, pole_mass = 0.2, pole_length = { var = "pole_length" }, max_force = 50, x0 = 0, theta0 = 0.15 } },
]

# Starter graph (graph.load): what the Flow page opens with. Optional; without it the
# Flow page opens empty.
[graph]
nodes = [
  { id = "cart-pole-1", type = "cart-pole", pos = [0, 120] },
  { id = "pid-theta", type = "pid", params = { kp = { var = "kp_theta" }, ki = 0, kd = { var = "kd_theta" } }, pos = [260, 0] },
  { id = "pid-x", type = "pid", params = { kp = 4, ki = 0, kd = 5 }, pos = [260, 200] },
  { id = "sum-1", type = "sum", pos = [520, 100] },
  { id = "graph-theta", type = "graph", pos = [260, 400] },
  { id = "graph-x", type = "graph", pos = [520, 400] },
]
edges = [
  { from = ["cart-pole-1", "theta"], to = ["pid-theta", "e"] },
  { from = ["cart-pole-1", "x"], to = ["pid-x", "e"] },
  { from = ["pid-theta", "u"], to = ["sum-1", "a"] },
  { from = ["pid-x", "u"], to = ["sum-1", "b"] },
  { from = ["sum-1", "y"], to = ["cart-pole-1", "force"] },
  { from = ["cart-pole-1", "theta"], to = ["graph-theta", "in"] },
  { from = ["cart-pole-1", "x"], to = ["graph-x", "in"] },
]
